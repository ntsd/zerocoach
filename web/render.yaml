services:
  - type: web
    name: zerocoach-web
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    customDomains:
      - zerocoach.tech
      - www.zerocoach.tech
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
